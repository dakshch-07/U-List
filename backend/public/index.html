    <style>
      #pwa-preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #pwa-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-logo {
        width: 180px;
        height: auto;
        animation: pulseLogo 1.6s ease-in-out infinite alternate;
      }
      .preloader-spinner {
        width: 32px;
        height: 32px;
        margin-top: 28px;
        border: 3px solid rgba(217, 72, 15, 0.15);
        border-top-color: #D9480F;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes pulseLogo {
        from { transform: scale(0.96); opacity: 0.92; }
        to { transform: scale(1.02); opacity: 1; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

    <script>
      (function() {
        var preloader = document.getElementById('pwa-preloader');
        var root = document.getElementById('root');
        
        function dismiss() {
          if (!preloader) return;
          preloader.classList.add('fade-out');
          setTimeout(function() {
            if (preloader && preloader.parentNode) preloader.parentNode.removeChild(preloader);
          }, 350);
        }

        if (root) {
          var observer = new MutationObserver(function() {
            if (root.children.length > 0) {
              dismiss();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        // Hard guarantee timeout: Never stay stuck under any circumstance
        setTimeout(dismiss, 1500);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/service-worker.js').catch(function() {});
          });
        }
      })();
    </script>
